plugins {
    id 'com.android.application' version '9.1.1'
}

android {
    namespace 'br.com.vercuno.mail'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.vercuno.mail'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
