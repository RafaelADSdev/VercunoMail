<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <title>Vercuno Mail</title>
  <link rel="stylesheet" href="mail.css">
  <script src="mail.js" type="module"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.2"/><path d="m15.5 15.5 4.2 4.2"/></symbol>
    <symbol id="inbox" viewBox="0 0 24 24"><path d="M3 13 6 5h12l3 8v6H3z"/><path d="M3 13h5l2 3h4l2-3h5"/></symbol>
    <symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.3.9-4.5 4.4 1.1 6.3L12 17.3l-5.6 2.9 1.1-6.3L3 9.5l6.3-.9z"/></symbol>
    <symbol id="send" viewBox="0 0 24 24"><path d="M21 3 9 15m12-12-7.5 18L9 15l-6-4.5L21 3z"/></symbol>
    <symbol id="draft" viewBox="0 0 24 24"><path d="M14 3H6v18h12V7zM14 3v5h4M9 12h6m-6 4h6"/></symbol>
    <symbol id="archive" viewBox="0 0 24 24"><path d="M4 4h16v4H4zM5 8v12h14V8m-9 4h4"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></symbol>
    <symbol id="spam" viewBox="0 0 24 24"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8zM12 8v4m0 4h.01"/></symbol>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 4v5h-5M4 20v-5h5"/><path d="M5.3 9a7 7 0 0 1 11.5-3L20 9M4 15l3.2 3a7 7 0 0 0 11.5-3"/></symbol>
    <symbol id="pencil" viewBox="0 0 24 24"><path d="m15 5 4 4m-14 7 11-11a2.8 2.8 0 0 1 4 4L9 20H5z"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="m12 5-7 7 7 7M5 12h15"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="external" viewBox="0 0 24 24"><path d="M13 4h7v7m0-7-9 9m7 0v7H4V6h7"/></symbol>
    <symbol id="clip" viewBox="0 0 24 24"><path d="m9 13 6-6a2 2 0 0 1 3 3l-8.5 8.5a4 4 0 0 1-5.7-5.7L13 4"/></symbol>
    <symbol id="download" viewBox="0 0 24 24"><path d="M12 4v11m-4-4 4 4 4-4M5 17v3h14v-3"/></symbol>
    <symbol id="reply" viewBox="0 0 24 24"><path d="m10 5-6 6 6 6m-6-6h9a6 6 0 0 1 6 6v2"/></symbol>
    <symbol id="out" viewBox="0 0 24 24"><path d="M11 4H5v16h6m-1-8h10m-4-4 4 4-4 4"/></symbol>
  </svg>

  <main id="startup" class="hero-state" aria-live="polite">
    <img class="startup-logo" src="brand.webp" alt="">
    <h1>Vercuno Mail</h1>
    <p id="startup-status">Conectando à sua caixa de e-mail…</p>
    <button id="startup-retry" class="primary" type="button" hidden>Tentar novamente</button>
  </main>

  <main id="mail" class="screen" hidden>
    <header class="mail-header">
      <div class="topline">
        <span class="brand"><img src="brand.webp" alt=""> Vercuno Mail</span>
        <button class="avatar account-button" id="account" type="button" aria-label="Conta"></button>
      </div>
      <div class="search-row">
        <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Pastas e caixas"><svg><use href="#menu"/></svg></button>
        <form id="search-form" role="search">
          <svg aria-hidden="true"><use href="#search"/></svg>
          <input id="query" type="search" placeholder="Buscar no e-mail" aria-label="Buscar no e-mail" enterkeyhint="search">
          <button class="icon-button" id="clear-search" type="button" aria-label="Limpar busca" hidden><svg><use href="#close"/></svg></button>
        </form>
      </div>
    </header>
    <section class="list-heading" aria-labelledby="folder-title">
      <div class="heading-line">
        <h1 id="folder-title" tabindex="-1">Caixa de entrada</h1>
        <button class="icon-button" id="refresh-button" type="button" aria-label="Atualizar mensagens"><svg><use href="#refresh"/></svg></button>
      </div>
      <div class="filters" id="filters" aria-label="Filtro de leitura">
        <button class="chip" type="button" data-filter="all" aria-pressed="true">Todas</button>
        <button class="chip" type="button" data-filter="unread" aria-pressed="false">Não lidas</button>
      </div>
    </section>
    <div id="list-scroll" class="list-scroll">
      <ul id="list" aria-label="Mensagens"></ul>
      <section id="list-state" class="hero-state list-empty" aria-live="polite" hidden>
        <div class="empty-icon" id="empty-icon"><svg aria-hidden="true"><use href="#inbox"/></svg></div>
        <h2 id="empty-title"></h2>
        <p id="empty-description"></p>
        <button id="list-retry" class="secondary" type="button" hidden>Tentar novamente</button>
      </section>
      <button class="secondary load-more" id="load-more" type="button" hidden>Carregar mais</button>
    </div>
    <button id="compose-button" class="primary compose-fab" type="button"><svg aria-hidden="true"><use href="#pencil"/></svg> Escrever</button>
  </main>

  <main id="detail" class="screen" hidden>
    <header class="screen-header">
      <button class="icon-button" type="button" data-back aria-label="Voltar"><svg><use href="#arrow"/></svg></button>
      <span>Mensagem</span>
      <div class="screen-actions" id="message-actions"></div>
    </header>
    <div id="message-content" class="detail-scroll"></div>
  </main>

  <main id="compose" class="screen" hidden>
    <header class="screen-header">
      <button class="icon-button" type="button" data-back aria-label="Voltar"><svg><use href="#arrow"/></svg></button>
      <h1 id="compose-title">Nova mensagem</h1>
      <div class="screen-actions">
        <button class="icon-button" id="pick-files" type="button" aria-label="Anexar arquivos"><svg><use href="#clip"/></svg></button>
        <button class="primary send-button" type="submit" form="compose-form" aria-label="Enviar mensagem"><svg aria-hidden="true"><use href="#send"/></svg><span>Enviar</span></button>
      </div>
    </header>
    <form id="compose-form" class="compose-form" autocomplete="off">
      <label class="field"><span>De</span><select id="sender" name="sender" required></select></label>
      <label class="field"><span>Para</span><input id="recipient" name="to" placeholder="destinatario@exemplo.com" inputmode="email" autocapitalize="none"></label>
      <label class="field"><span>Assunto</span><input name="subject" id="subject" placeholder="Assunto da mensagem"></label>
      <label class="message-field"><span class="sr-only">Mensagem</span><textarea name="text" id="body" placeholder="Escreva sua mensagem"></textarea></label>
      <input id="files" type="file" multiple hidden>
      <ul id="files-list" class="files-list"></ul>
      <p id="compose-error" class="form-error" role="alert" hidden></p>
    </form>
    <footer class="compose-footer"><button id="save-draft" class="secondary" type="button"><svg aria-hidden="true"><use href="#draft"/></svg> Salvar rascunho</button></footer>
  </main>

  <dialog id="folders" class="drawer" aria-labelledby="folders-title">
    <header class="dialog-header">
      <h2 id="folders-title">Pastas</h2>
      <button type="button" class="icon-button" data-close aria-label="Fechar menu"><svg><use href="#close"/></svg></button>
    </header>
    <div id="mailbox-field" hidden><label for="mailbox">Caixa de e-mail</label><select id="mailbox"></select></div>
    <nav id="folder-nav" aria-label="Pastas de e-mail"></nav>
  </dialog>

  <dialog id="profile" class="profile-dialog" aria-labelledby="profile-title">
    <header class="dialog-header">
      <h2 id="profile-title">Sua conta</h2>
      <button type="button" class="icon-button" data-close aria-label="Fechar conta"><svg><use href="#close"/></svg></button>
    </header>
    <div class="account-summary"><div id="profile-avatar" class="avatar"></div><div><strong id="profile-name"></strong><div id="profile-email"></div></div></div>
    <a id="webmail" class="nav-row" href="/inbox?web=1"><svg aria-hidden="true"><use href="#external"/></svg> Abrir webmail completo</a>
    <button type="button" id="logout" class="nav-row"><svg aria-hidden="true"><use href="#out"/></svg> Sair da conta</button>
  </dialog>

  <dialog id="leave-compose" class="profile-dialog" aria-labelledby="leave-title">
    <header class="dialog-header"><h2 id="leave-title">Salvar esta mensagem?</h2></header>
    <p>Você pode continuar de onde parou na pasta Rascunhos.</p>
    <div class="leave-actions">
      <button type="button" class="secondary" data-close>Continuar escrevendo</button>
      <button type="button" class="secondary" id="discard">Fechar sem salvar</button>
      <button type="button" class="primary" id="confirm-save">Salvar rascunho</button>
    </div>
  </dialog>
  <div id="toast" role="status" class="toast" hidden></div>
</body>
</html>
